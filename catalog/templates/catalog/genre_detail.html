{% extends "base_generic.html" %}
{% block content %}
  <h1>Genre: {{ genre.name }}</h1>
  <div style="margin-left:20px;margin-top:20px">
    <h4>Books</h4>
    {% for book in genre.book_set.all %}
      <hr>
      <p><a href="{{ book.get_absolute_url }}">{{ book.title }}</a> ({{ book.author }})</p>
    {% empty %}
      <p>No books in this genre.</p>
    {% endfor %}
  </div>
{% endblock %}
